<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>数字关联分组 · 生肖圆圈</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 16px 12px;
        }
        .card {
            max-width: 720px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06), 0 8px 18px rgba(0,0,0,0.05);
            padding: 1.8rem 1.5rem 2.2rem;
            transition: padding 0.2s;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 650;
            letter-spacing: -0.02em;
            margin-bottom: 0.2rem;
            color: #162b3a;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-wrap: wrap;
        }
        .sub {
            color: #2d4059;
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
            border-left: 5px solid #b83b5e;
            padding: 0.6rem 1rem 0.6rem 1.2rem;
            background: #f8fafd;
            border-radius: 0 18px 18px 0;
            line-height: 1.5;
            word-break: break-word;
        }
        .sub strong {
            color: #b83b5e;
            font-weight: 650;
        }
        .input-area {
            display: flex;
            gap: 12px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        #numberInput {
            flex: 1 1 200px;
            min-width: 200px;
            padding: 0 20px;
            height: 56px;
            border: 2px solid #dde3ed;
            border-radius: 60px;
            font-size: 1.1rem;
            background: white;
            transition: 0.2s;
            outline: none;
            color: #0f2b3c;
            -webkit-appearance: none;
        }
        #numberInput:focus {
            border-color: #b83b5e;
            box-shadow: 0 0 0 4px rgba(184,59,94,0.2);
        }
        #submitBtn {
            background: #b83b5e;
            color: white;
            border: none;
            height: 56px;
            padding: 0 30px;
            border-radius: 60px;
            font-size: 1.15rem;
            font-weight: 580;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 8px 18px rgba(184,59,94,0.3);
            white-space: nowrap;
            flex: 0 0 auto;
            border: 1px solid rgba(255,255,255,0.1);
            -webkit-tap-highlight-color: transparent;
        }
        #submitBtn:active {
            transform: scale(0.97);
            background: #9f2d4f;
        }
        #clearBtn {
            background: #eef2f6;
            color: #2d4059;
            border: 2px solid #d4dee9;
            height: 56px;
            padding: 0 24px;
            border-radius: 60px;
            font-size: 1.15rem;
            font-weight: 580;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
            flex: 0 0 auto;
            -webkit-tap-highlight-color: transparent;
        }
        #clearBtn:active {
            background: #dbe1ea;
            transform: scale(0.97);
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 8px;
        }
        .result-header h3 {
            font-weight: 650;
            font-size: 1.3rem;
            color: #0f293f;
        }
        .hint-badge {
            background: #e8edf5;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-size: 0.85rem;
            color: #2e405b;
            font-weight: 500;
        }
        .result-list {
            background: #ffffff;
            border-radius: 28px;
            border: 1px solid #e9f0f6;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .row {
            display: flex;
            align-items: center;
            padding: 0.9rem 1rem;
            border-bottom: 2px solid #dee9f2;
            transition: background 0.1s;
            gap: 12px;
        }
        .row:last-child {
            border-bottom: none;
        }
        .index-circle {
            width: 44px;
            height: 44px;
            background: white;
            border: 2.5px solid #b83b5e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: #b83b5e;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(184,59,94,0.15);
            line-height: 1;
        }
        .numbers-row {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0 0.2rem;
            font-size: 1.15rem;
            line-height: 1.5;
            flex-wrap: wrap;
        }
        .input-number {
            font-weight: 600;
            color: #000000;
            white-space: nowrap;
        }
        .supplement {
            font-weight: 600;
            color: #b83b5e;
            white-space: nowrap;
        }
        .empty-message {
            text-align: center;
            padding: 3rem 1.5rem;
            color: #5e738e;
            background: #f9fcff;
            border-radius: 40px;
            border: 1.5px dashed #cbd6e4;
            font-size: 1.05rem;
        }
        .example-note {
            color: #2a4d6c;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            background: #eef3f9;
            padding: 0.8rem 1.2rem;
            border-radius: 50px;
            display: inline-block;
            width: auto;
        }
        .example-note code {
            background: #d3deed;
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
            color: #132a3b;
            font-weight: 500;
        }
        .zodiac-table {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            margin-top: 20px;
            margin-bottom: 1.8rem;
        }
        .zodiac-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f8fafd;
            border: 1px solid #e0e8f0;
            border-radius: 10px;
            padding: 6px 2px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .zodiac-cell:active {
            transform: scale(0.93);
        }
        .zodiac-cell.selected {
            background: #b83b5e;
            border-color: #9f2d4f;
        }
        .zodiac-cell.selected .z-num {
            color: #fff;
        }
        .zodiac-cell.selected .z-name {
            color: #ffd6e0;
        }
        .z-num {
            font-weight: 700;
            color: #162b3a;
            font-size: 0.9rem;
            line-height: 1.3;
        }
        .z-name {
            color: #b83b5e;
            font-size: 0.78rem;
            font-weight: 600;
            line-height: 1.3;
        }
        footer {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #7085a2;
            text-align: center;
        }

        @media (max-width: 600px) {
            .input-area {
                gap: 10px;
            }
            #numberInput {
                flex: 1 1 100%;
            }
            #submitBtn, #clearBtn {
                flex: 1 1 calc(50% - 5px);
                padding: 0 10px;
                text-align: center;
            }
        }

        @media (max-width: 500px) {
            .zodiac-table {
                grid-template-columns: repeat(5, 1fr);
            }
            .card {
                padding: 1.3rem 1rem 1.8rem;
                border-radius: 28px;
            }
            h1 {
                font-size: 1.6rem;
            }
            .sub {
                font-size: 0.9rem;
                padding: 0.5rem 0.8rem 0.5rem 1rem;
            }
            #numberInput {
                height: 52px;
                font-size: 1rem;
                padding: 0 16px;
            }
            #submitBtn, #clearBtn {
                height: 52px;
                font-size: 1rem;
            }
            .index-circle {
                width: 38px;
                height: 38px;
                font-size: 0.95rem;
                border-width: 2px;
                margin-right: 4px;
            }
            .numbers-row {
                font-size: 1rem;
                gap: 0 0.1rem;
                flex-wrap: nowrap;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                white-space: nowrap;
                width: 100%;
            }
            .numbers-row > span {
                flex-shrink: 0;
                font-size: 1rem;
            }
            .result-header h3 {
                font-size: 1.2rem;
            }
            .hint-badge {
                font-size: 0.75rem;
                padding: 0.2rem 1rem;
            }
        }

        @media (max-width: 375px) {
            .index-circle {
                width: 34px;
                height: 34px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔗 十二生肖 · 数字关联</h1>
        <div class="zodiac-table">
            <div class="zodiac-cell"><span class="z-num">1</span><span class="z-name">马</span></div>
            <div class="zodiac-cell"><span class="z-num">2</span><span class="z-name">蛇</span></div>
            <div class="zodiac-cell"><span class="z-num">3</span><span class="z-name">龙</span></div>
            <div class="zodiac-cell"><span class="z-num">4</span><span class="z-name">兔</span></div>
            <div class="zodiac-cell"><span class="z-num">5</span><span class="z-name">虎</span></div>
            <div class="zodiac-cell"><span class="z-num">6</span><span class="z-name">牛</span></div>
            <div class="zodiac-cell"><span class="z-num">7</span><span class="z-name">鼠</span></div>
            <div class="zodiac-cell"><span class="z-num">8</span><span class="z-name">猪</span></div>
            <div class="zodiac-cell"><span class="z-num">9</span><span class="z-name">狗</span></div>
            <div class="zodiac-cell"><span class="z-num">10</span><span class="z-name">鸡</span></div>
            <div class="zodiac-cell"><span class="z-num">11</span><span class="z-name">猴</span></div>
            <div class="zodiac-cell"><span class="z-num">12</span><span class="z-name">羊</span></div>
            <div class="zodiac-cell"><span class="z-num">13</span><span class="z-name">马</span></div>
            <div class="zodiac-cell"><span class="z-num">14</span><span class="z-name">蛇</span></div>
            <div class="zodiac-cell"><span class="z-num">15</span><span class="z-name">龙</span></div>
            <div class="zodiac-cell"><span class="z-num">16</span><span class="z-name">兔</span></div>
            <div class="zodiac-cell"><span class="z-num">17</span><span class="z-name">虎</span></div>
            <div class="zodiac-cell"><span class="z-num">18</span><span class="z-name">牛</span></div>
            <div class="zodiac-cell"><span class="z-num">19</span><span class="z-name">鼠</span></div>
            <div class="zodiac-cell"><span class="z-num">20</span><span class="z-name">猪</span></div>
            <div class="zodiac-cell"><span class="z-num">21</span><span class="z-name">狗</span></div>
            <div class="zodiac-cell"><span class="z-num">22</span><span class="z-name">鸡</span></div>
            <div class="zodiac-cell"><span class="z-num">23</span><span class="z-name">猴</span></div>
            <div class="zodiac-cell"><span class="z-num">24</span><span class="z-name">羊</span></div>
            <div class="zodiac-cell"><span class="z-num">25</span><span class="z-name">马</span></div>
            <div class="zodiac-cell"><span class="z-num">26</span><span class="z-name">蛇</span></div>
            <div class="zodiac-cell"><span class="z-num">27</span><span class="z-name">龙</span></div>
            <div class="zodiac-cell"><span class="z-num">28</span><span class="z-name">兔</span></div>
            <div class="zodiac-cell"><span class="z-num">29</span><span class="z-name">虎</span></div>
            <div class="zodiac-cell"><span class="z-num">30</span><span class="z-name">牛</span></div>
            <div class="zodiac-cell"><span class="z-num">31</span><span class="z-name">鼠</span></div>
            <div class="zodiac-cell"><span class="z-num">32</span><span class="z-name">猪</span></div>
            <div class="zodiac-cell"><span class="z-num">33</span><span class="z-name">狗</span></div>
            <div class="zodiac-cell"><span class="z-num">34</span><span class="z-name">鸡</span></div>
            <div class="zodiac-cell"><span class="z-num">35</span><span class="z-name">猴</span></div>
            <div class="zodiac-cell"><span class="z-num">36</span><span class="z-name">羊</span></div>
            <div class="zodiac-cell"><span class="z-num">37</span><span class="z-name">马</span></div>
            <div class="zodiac-cell"><span class="z-num">38</span><span class="z-name">蛇</span></div>
            <div class="zodiac-cell"><span class="z-num">39</span><span class="z-name">龙</span></div>
            <div class="zodiac-cell"><span class="z-num">40</span><span class="z-name">兔</span></div>
            <div class="zodiac-cell"><span class="z-num">41</span><span class="z-name">虎</span></div>
            <div class="zodiac-cell"><span class="z-num">42</span><span class="z-name">牛</span></div>
            <div class="zodiac-cell"><span class="z-num">43</span><span class="z-name">鼠</span></div>
            <div class="zodiac-cell"><span class="z-num">44</span><span class="z-name">猪</span></div>
            <div class="zodiac-cell"><span class="z-num">45</span><span class="z-name">狗</span></div>
            <div class="zodiac-cell"><span class="z-num">46</span><span class="z-name">鸡</span></div>
            <div class="zodiac-cell"><span class="z-num">47</span><span class="z-name">猴</span></div>
            <div class="zodiac-cell"><span class="z-num">48</span><span class="z-name">羊</span></div>
            <div class="zodiac-cell"><span class="z-num">49</span><span class="z-name">马</span></div>
        </div>

        <div class="input-area">
            <input type="text" id="numberInput" placeholder="例: 23-6,2、31 10 9 41 1 20" value="23-6,2、31 10 9 41 1 20">
            <button id="submitBtn">确认</button>
            <button id="clearBtn">一键清空</button>
        </div>

        <div class="result-header">
            <h3>📋 分组结果</h3>
            <span class="hint-badge">生肖圆圈 · 全括号</span>
        </div>
        <div id="resultContainer" class="result-list">
            <!-- 动态生成行 -->
        </div>
        <div class="example-note"></div>
        <footer>加减12链条 · 移动端1rem · 生肖圆圈</footer>
    </div>

    <script>
        (function() {
            const inputField = document.getElementById('numberInput');
            const submitBtn = document.getElementById('submitBtn');
            const clearBtn = document.getElementById('clearBtn');
            const resultDiv = document.getElementById('resultContainer');

            // 生肖映射表：base (1-12) -> 生肖名称
            const zodiacMap = {
                1: '马',
                2: '蛇',
                3: '龙',
                4: '兔',
                5: '虎',
                6: '牛',
                7: '鼠',
                8: '猪',
                9: '狗',
                10: '鸡',
                11: '猴',
                12: '羊'
            };

            function buildGroups(inputStr) {
                const rawMatches = inputStr.match(/\d+/g);
                if (!rawMatches) return { groups: [], inputSet: new Set() };

                const uniqueOrdered = [];
                const seen = new Set();
                for (let match of rawMatches) {
                    const num = parseInt(match, 10);
                    if (isNaN(num) || num < 1 || num > 49) continue;
                    if (!seen.has(num)) {
                        seen.add(num);
                        uniqueOrdered.push(num);
                    }
                }

                const inputSet = new Set(uniqueOrdered);

                const groupBases = [];
                const baseSet = new Set();

                for (let num of uniqueOrdered) {
                    const base = ((num - 1) % 12) + 1;
                    if (!baseSet.has(base)) {
                        baseSet.add(base);
                        groupBases.push(base);
                    }
                }

                const groups = [];
                for (let base of groupBases) {
                    const members = [];
                    let current = base;
                    while (current <= 49) {
                        members.push(current);
                        current += 12;
                    }
                    groups.push({
                        base: base,
                        numbers: members
                    });
                }

                return { groups, inputSet };
            }

            function render() {
                const rawInput = inputField.value.trim();
                const { groups, inputSet } = buildGroups(rawInput);

                // 排序：按原始输入数字数量降序
                groups.sort((a, b) => {
                    const countA = a.numbers.filter(num => inputSet.has(num)).length;
                    const countB = b.numbers.filter(num => inputSet.has(num)).length;
                    return countB - countA;
                });

                resultDiv.innerHTML = '';

                if (groups.length === 0) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'empty-message';
                    emptyDiv.innerText = '✨ 输入1~49之间的数字（用任意符号分隔）';
                    resultDiv.appendChild(emptyDiv);
                    return;
                }

                groups.forEach((group) => {
                    const row = document.createElement('div');
                    row.className = 'row';

                    // 根据base获取生肖名称
                    const zodiacName = zodiacMap[group.base] || group.base; // 容错，但应该都有

                    const circle = document.createElement('span');
                    circle.className = 'index-circle';
                    circle.textContent = zodiacName;
                    row.appendChild(circle);

                    const numbersSpan = document.createElement('span');
                    numbersSpan.className = 'numbers-row';

                    // 构建带括号的数字，不加顿号
                    group.numbers.forEach((num) => {
                        if (inputSet.has(num)) {
                            // 原始输入：黑色【数字】
                            const span = document.createElement('span');
                            span.className = 'input-number';
                            span.textContent = `【${num}】`;
                            numbersSpan.appendChild(span);
                        } else {
                            // 补充：红色【数字】
                            const span = document.createElement('span');
                            span.className = 'supplement';
                            span.textContent = `【${num}】`;
                            numbersSpan.appendChild(span);
                        }
                    });

                    row.appendChild(numbersSpan);
                    resultDiv.appendChild(row);
                });
            }

            function clearInputAndResult() {
                inputField.value = '';
                render();
            }

            submitBtn.addEventListener('click', render);
            clearBtn.addEventListener('click', clearInputAndResult);
            inputField.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    render();
                }
            });

            // 生肖表格点击选中/取消
            document.querySelectorAll('.zodiac-cell').forEach(cell => {
                cell.addEventListener('click', () => {
                    cell.classList.toggle('selected');
                });
            });

            window.addEventListener('load', () => {
                render();
            });
        })();
    </script>
</body>
</html>
